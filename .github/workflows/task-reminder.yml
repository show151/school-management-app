name: Task Reminder

on:
  schedule:
    # 毎日7:00 JST (UTC 22:00 前日) に実行
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call task reminder API
        run: |
          curl -f -X GET \
            "${{ secrets.APP_URL }}/api/cron/task-reminder?secret=${{ secrets.CRON_SECRET }}"
