name: Task Reminder Cron

on:
  schedule:
    # Runs at 02:00 JST every day (17:00 UTC previous day)
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  call-task-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger task reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL-}" ]; then
            echo "SITE_URL repository secret is not set. Add SITE_URL (e.g. https://your-site.example.com)"
            exit 1
          fi
          if [ -z "${CRON_SECRET-}" ]; then
            echo "CRON_SECRET repository secret is not set. Add CRON_SECRET with the same value as your app's CRON_SECRET"
            exit 1
          fi
          URL="${SITE_URL%/}/api/cron/task-reminder"
          echo "Calling ${URL}"
          # Fail the job if the HTTP request fails or returns non-2xx
          HTTP_RESPONSE=$(curl -sS -w "\n%{http_code}" -H "X-Cron-Secret: ${CRON_SECRET}" "$URL")
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          echo "HTTP $HTTP_CODE"
          echo "$HTTP_BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Request failed with status $HTTP_CODE"
            exit 1
          fi